[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nauttrack"
version = "0.1.0"
description = "RGB-only multi-object tracking research prototype built on Ultralytics YOLO26"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
dependencies = [
  "ultralytics==8.4.215",
  "numpy>=1.23.0",
  "scipy>=1.10.0",
  "opencv-python>=4.7.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.5.0"]

[project.scripts]
nauttrack = "nauttrack.app:main"

[tool.setuptools.packages.find]
include = ["nauttrack*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
